# FlowForge AI - Docker Deployment

version: '3.8'

services:
  flowforge-ai:
    image: yatindrarai002/flowforgeai:latest
    container_name: flowforge-ai
    ports:
      - "80:80"      # Frontend (Nginx)
      - "8000:8000"  # Backend API
    environment:
      # LLM Configuration
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=gemini-1.5-flash
      - LLM_TEMPERATURE=0.7
      - LLM_MAX_TOKENS=2048
      
      # Optional: Ollama configuration (if using local Ollama)
      # - LLM_PROVIDER=ollama
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - PLANNER_MODEL=phi3:mini
      # - RESEARCHER_MODEL=llama3.2:3b
      # - WRITER_MODEL=gemma:2b
      # - REVIEWER_MODEL=qwen2.5:1.5b
      # - ASSEMBLER_MODEL=phi3:mini
      
      # Server Configuration
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: flowforge-network
