services:
  # Backend Service
  - type: web
    name: flowforge-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python main_flowforge.py"
    envVars:
      - key: LLM_PROVIDER
        value: ollama
      - key: LLM_MODEL
        value: phi3:mini
      - key: LLM_TEMPERATURE
        value: 0.7
      - key: LLM_MAX_TOKENS
        value: 800
      - key: LLM_TIMEOUT
        value: 180
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: PLANNER_MODEL
        value: phi3:mini
      - key: RESEARCHER_MODEL
        value: llama3.2:3b
      - key: WRITER_MODEL
        value: gemma:2b
      - key: REVIEWER_MODEL
        value: qwen2.5:1.5b
      - key: ASSEMBLER_MODEL
        value: phi3:mini
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Service
  - type: web
    name: flowforge-frontend
    env: node
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s dist -l $PORT"
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
